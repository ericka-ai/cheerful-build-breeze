[project]
name = "ticket-generator"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
    "python-multipart>=0.0.9",
    "aztec_code_generator>=0.12",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "pycryptodome>=3.20.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

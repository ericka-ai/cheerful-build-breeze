services:
  - type: web
    name: ticket-generator
    runtime: python
    plan: free
    rootDir: ticket_webapp
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
  - type: web
    name: apk-analyzer
    runtime: python
    plan: free
    rootDir: apk_analyzer
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
